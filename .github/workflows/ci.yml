name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      # Provide dummy env vars for build
      VITE_BACKEND_URL: http://localhost:3001
      VITE_FIREBASE_API_KEY: dummy
      VITE_FIREBASE_AUTH_DOMAIN: dummy
      VITE_FIREBASE_PROJECT_ID: dummy
      VITE_FIREBASE_MESSAGING_SENDER_ID: dummy
      VITE_FIREBASE_APP_ID: dummy
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm ci || npm install
      
      - name: Install server dependencies
        run: npm ci || npm install
        working-directory: server
      
      - name: Lint (optional)
        run: |
          npx eslint . --max-warnings=100 || echo "⚠️ Linting skipped or found warnings"
        continue-on-error: true
      
      - name: Typecheck frontend (optional)
        run: npx tsc -p tsconfig.json --noEmit || echo "⚠️ Frontend typecheck found errors"
        continue-on-error: true
      
      - name: Typecheck backend (optional)
        run: npx tsc -p server/tsconfig.json --noEmit || echo "⚠️ Backend typecheck found errors"
        working-directory: server
        continue-on-error: true
      
      - name: Build frontend
        run: npm run build
      
      - name: Build backend
        run: npm run build
        working-directory: server
      
      - name: Run tests (if configured)
        run: npm test || echo "⚠️ Tests not configured or failed"
        continue-on-error: true
