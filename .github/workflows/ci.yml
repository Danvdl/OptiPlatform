name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    env:
      # Provide dummy env vars for build and tests
      VITE_BACKEND_URL: http://localhost:3001
      VITE_FIREBASE_API_KEY: dummy
      VITE_FIREBASE_AUTH_DOMAIN: dummy
      VITE_FIREBASE_PROJECT_ID: dummy
      VITE_FIREBASE_MESSAGING_SENDER_ID: dummy
      VITE_FIREBASE_APP_ID: dummy
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: test-secret-key-for-ci
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm ci || npm install
      
      - name: Install server dependencies
        run: npm ci || npm install
        working-directory: server
      
      - name: Lint frontend
        run: |
          npx eslint . --max-warnings=100 || echo "⚠️ Linting found warnings (non-blocking)"
        continue-on-error: true
      
      - name: Typecheck frontend
        run: npx tsc -p tsconfig.json --noEmit
      
      - name: Typecheck backend
        run: npx tsc -p tsconfig.json --noEmit
        working-directory: server
      
      - name: Build frontend
        run: npm run build
      
      - name: Build backend
        run: npm run build
        working-directory: server
      
      - name: Run backend unit tests
        run: npm run test -- --coverage --verbose --coverageThreshold='{}'
        working-directory: server
        continue-on-error: false
      
      - name: Run frontend unit tests
        run: npm run test:frontend -- --coverage --verbose
        continue-on-error: false
      
      - name: Upload backend test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: server/coverage/
          retention-days: 30
      
      - name: Upload frontend test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 30

  build:
    name: Build Suite
    runs-on: ubuntu-latest
    needs: test
    
    env:
      VITE_BACKEND_URL: http://localhost:3001
      VITE_FIREBASE_API_KEY: dummy
      VITE_FIREBASE_AUTH_DOMAIN: dummy
      VITE_FIREBASE_PROJECT_ID: dummy
      VITE_FIREBASE_MESSAGING_SENDER_ID: dummy
      VITE_FIREBASE_APP_ID: dummy
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm ci || npm install
      
      - name: Install server dependencies
        run: npm ci || npm install
        working-directory: server
      
      - name: Build frontend (production)
        run: npm run build
      
      - name: Build backend (production)
        run: npm run build
        working-directory: server
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            server/dist/
          retention-days: 7
